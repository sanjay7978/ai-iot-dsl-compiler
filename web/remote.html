<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sensor remote · Kelvin</title>
  <meta name="theme-color" content="#0c0b0a">
  <style>
    /* Kelvin palette (kept inline: the phone may only load this one page) */
    :root {
      --bg: #f7f5f1; --panel: #ffffff; --ink: #171512; --muted: #5f5a53; --faint: #827b72;
      --line: #e6e1d9; --accent: #c94410; --accent-ink: #fff; --accent-soft: #fbeae0; --ok: #0e7c92; --error: #c22a44;
      --cool: #0e7c92; --ember: #e5581c;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0c0b0a; --panel: #141311; --ink: #f3f0ea; --muted: #aaa39a; --faint: #8a837a;
              --line: #24221f; --accent: #ff6a2b; --accent-ink: #1b0b03; --accent-soft: #2b170e; --ok: #7fd4e6; --error: #ff6b81;
              --cool: #7fd4e6; --ember: #ff6a2b;
              color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
           padding: max(18px, env(safe-area-inset-top)) 16px 32px; -webkit-font-smoothing: antialiased; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { flex-shrink: 0; }
    h1 { font-size: 19px; margin: 0; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; font-family: var(--mono); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); display: inline-block; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .name { font: 600 15px var(--mono); display: flex; justify-content: space-between; align-items: baseline; }
    .value { font: 600 24px var(--mono); color: var(--accent); letter-spacing: -0.02em; }
    .type { font-size: 12px; color: var(--faint); font-family: var(--mono); }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; margin: 6px 0 0; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--cool), var(--line) 50%, var(--ember)); }
    input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--cool), var(--line) 50%, var(--ember)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--ink); border: 4px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
    input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 4px solid var(--panel); }
    .seg { display: flex; gap: 8px; margin-top: 12px; }
    .seg button { flex: 1; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
                  color: var(--ink); font: 600 15px var(--mono); transition: background-color .15s, border-color .15s; }
    .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
    .err { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6.5" fill="currentColor"/><path d="M8 5.5v8.2M13.2 8.6l4 3.4-4 3.4" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16.6" r="2.6" fill="var(--ember)"/></svg>
      <div><h1>Sensor remote</h1><p class="sub" id="program">Connecting…</p></div>
    </div>
    <span class="dot" id="dot" title="Connection"></span>
  </header>
  <main id="sensors"><p class="empty">Waiting for the laptop to compile a program…</p></main>

  <script>
    // The phone page: shows the current program's sensors and sends every change
    // to the laptop (which runs the compiled rules and updates its digital twin).
    (function () {
      "use strict";
      const key = new URLSearchParams(location.search).get("k") || "";
      const q = "?k=" + encodeURIComponent(key);
      let version = -1;
      const values = {};

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const unit = (n) => /temp|outside/i.test(n) ? " °C" : /humid|soil|moist/i.test(n) ? " %" : /light|lux/i.test(n) ? " lx" : "";

      let sendTimer = {};
      function send(name, value) {
        clearTimeout(sendTimer[name]);
        sendTimer[name] = setTimeout(() => {
          fetch("/api/remote/state" + q, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, value: String(value) }) })
            .then((r) => document.getElementById("dot").className = "dot" + (r.ok ? " ok" : ""))
            .catch(() => document.getElementById("dot").className = "dot");
        }, 60);
      }

      function render(cfg) {
        document.getElementById("program").textContent = cfg.sensors.length ? "Program: " + cfg.program : "No sensors in the current program";
        const host = document.getElementById("sensors");
        host.innerHTML = "";
        cfg.sensors.forEach((s) => {
          const card = document.createElement("section");
          card.className = "card";
          const v = values[s.name] ?? s.value ?? (s.type === "NUMBER" ? s.first : s.options[0]);
          values[s.name] = v;
          if (s.type === "NUMBER") {
            card.innerHTML = `<div class="name"><span>${esc(s.name)}</span><span class="value">${esc(v)}${unit(s.name)}</span></div>` +
              `<input type="range" min="${s.min}" max="${Math.max(s.max, v)}" step="${s.step}" value="${v}" aria-label="${esc(s.name)}">`;
            const range = card.querySelector("input"), out = card.querySelector(".value");
            range.addEventListener("input", () => { values[s.name] = +range.value; out.textContent = range.value + unit(s.name); send(s.name, range.value); });
          } else {
            card.innerHTML = `<div class="name"><span>${esc(s.name)}</span><span class="type">STATE</span></div><div class="seg">` +
              s.options.map((o) => `<button type="button" class="${o === v ? "on" : ""}" data-v="${o}">${o}</button>`).join("") + "</div>";
            card.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
              values[s.name] = b.dataset.v;
              card.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
              send(s.name, b.dataset.v);
            }));
          }
          host.appendChild(card);
        });
      }

      async function poll() {
        try {
          const r = await fetch("/api/remote/config" + q);
          if (r.status === 403) {
            document.getElementById("sensors").innerHTML = '<p class="empty err">This link has expired. Scan the QR code again.</p>';
            return;
          }
          const cfg = await r.json();
          document.getElementById("dot").className = "dot ok";
          if (cfg.version !== version) { version = cfg.version; render(cfg); }
        } catch (e) {
          document.getElementById("dot").className = "dot";
        }
        setTimeout(poll, 1500);
      }
      poll();
    })();
  </script>
</body>
</html>
